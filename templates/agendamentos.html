<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>VetPrime - Agendamentos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">VetPrime</a>
      <div class="navbar-nav me-auto">
        <a class="nav-link text-white" href="/tutores">Tutores</a>
        <a class="nav-link text-white" href="/pets">Pets</a>
        <a class="nav-link active" href="/agendamentos">Agendamentos</a>
      </div>
      <span class="navbar-text text-white me-3">Usuário: <strong id="nome-usuario">...</strong></span>
      <a href="/logout" class="btn btn-outline-light btn-sm">Sair</a>
    </div>
  </nav>

  <div class="container">
    <h2>Agendamentos de Consultas</h2>

    <div class="card card-form my-3 p-3">
      <h5>Novo Agendamento</h5>
      <form action="/api/agendamentos" method="POST" class="row g-2">
        <div class="col-md-3">
          <input type="text" name="data_agendamento" class="form-control" placeholder="Data (Ex: 2026-10-20 14:00)" required>
        </div>
        <div class="col-md-2">
          <select name="mes" class="form-select" required>
            <option value="">Selecione o Mês</option>
            <option value="Janeiro">Janeiro</option>
            <option value="Fevereiro">Fevereiro</option>
            <option value="Março">Março</option>
            <option value="Abril">Abril</option>
            <option value="Maio">Maio</option>
            <option value="Junho">Junho</option>
            <option value="Julho">Julho</option>
            <option value="Agosto">Agosto</option>
            <option value="Setembro">Setembro</option>
            <option value="Outubro">Outubro</option>
            <option value="Novembro">Novembro</option>
            <option value="Dezembro">Dezembro</option>
          </select>
        </div>
        <div class="col-md-2">
          <select name="tutor_id" id="select-tutores" class="form-select" required>
            <option value="">Tutor</option>
          </select>
        </div>
        <div class="col-md-2">
          <select name="pet_id" id="select-pets" class="form-select" required>
            <option value="">Pet</option>
          </select>
        </div>
        <div class="col-md-2">
          <input type="text" name="observacao" class="form-control" placeholder="Observações">
        </div>
        <div class="col-md-1">
          <button type="submit" class="btn btn-success w-100">Salvar</button>
        </div>
      </form>
    </div>

    <table class="table table-bordered table-custom">
      <thead>
        <tr>
          <th>Mês</th>
          <th>Data e Hora</th>
          <th>Tutor</th>
          <th>CPF do Tutor</th>
          <th>Pet</th>
          <th>Observação</th>
        </tr>
      </thead>
      <tbody id="tabela-agendamentos"></tbody>
    </table>
  </div>

  <script>
    fetch('/api/usuario-logado')
      .then(r => r.json())
      .then(d => document.getElementById('nome-usuario').innerText = d.nome);

    fetch('/api/tutores')
      .then(r => r.json())
      .then(tutores => {
        const select = document.getElementById('select-tutores');
        tutores.forEach(t => {
          select.innerHTML += `<option value="${t.id}">${t.nome}</option>`;
        });
      });

    fetch('/api/pets')
      .then(r => r.json())
      .then(pets => {
        const select = document.getElementById('select-pets');
        pets.forEach(p => {
          select.innerHTML += `<option value="${p.id}">${p.nome}</option>`;
        });
      });

    fetch('/api/agendamentos')
      .then(r => r.json())
      .then(dados => {
        const tbody = document.getElementById('tabela-agendamentos');
        dados.forEach(a => {
          tbody.innerHTML += `
            <tr>
              <td><strong>${a.mes}</strong></td>
              <td>${a.data_agendamento}</td>
              <td>${a.nome_tutor}</td>
              <td>${a.cpf_tutor}</td>
              <td>${a.nome_pet} (${a.especie_pet})</td>
              <td>${a.observacao || ''}</td>
            </tr>
          `;
        });
      });
  </script>
</body>
</html>
