<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>VetPrime - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="login-container">
    <div class="card card-login p-4">
      <h3 class="text-center text-primary mb-2">VetPrime</h3>
      <p class="text-muted text-center mb-4">Acesso ao Sistema</p>

      {% if erro %}
        <div class="alert alert-danger mb-3">{{ erro }}</div>
      {% endif %}

      <form action="/login" method="POST">
        <div class="mb-3">
          <label class="form-label">E-mail:</label>
          <input type="email" name="email" class="form-control" placeholder="carlos@vetprime.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Senha:</label>
          <input type="password" name="senha" class="form-control" placeholder="123456" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
      </form>
    </div>
  </div>
</body>
</html>
